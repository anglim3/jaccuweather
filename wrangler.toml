name = "weather-app"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Do not commit a personal account_id here.
# After `npx wrangler login`, Wrangler uses your default account.
# Or set: export CLOUDFLARE_ACCOUNT_ID=...

# Fail-closed per-IP cap on /api/pollen billed Google/Tomorrow lookups.
# namespace_id is an account-local integer string (not a secret).
# Wrangler 4.36+ (this project pins ^4.54.0).
[[ratelimits]]
name = "POLLEN_RATE_LIMIT"
namespace_id = "27082701"

  [ratelimits.simple]
  limit = 20
  period = 60

# Worker Previews (npx wrangler preview): each branch gets an isolated,
# production-like preview URL. Previews must not touch production resources,
# so the preview config declares its own rate-limit binding. Mirror the
# production shape with preview-safe values; the namespace_id is an
# account-local integer string, not a secret.
[[previews.ratelimits]]
name = "POLLEN_RATE_LIMIT"
namespace_id = "27082701"

  [previews.ratelimits.simple]
  limit = 20
  period = 60


# City-level visit log (HTML page views only; no IP addresses).
# The account was at the D1 database limit when this binding was added,
# so the UUIDs below are placeholders. After creating the remote databases
# `jaccuweather-visits` and `jaccuweather-visits-preview`, replace both
# IDs, then apply migrations and deploy.
[[d1_databases]]
binding = "VISITS"
database_name = "jaccuweather-visits"
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

# Isolated Preview database so Previews do not write to production visits.
[[previews.d1_databases]]
binding = "VISITS"
database_name = "jaccuweather-visits-preview"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"
